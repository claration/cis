name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - v*

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: brew install create-dmg

      # - name: Setup Certificates
      #   uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
      #   with:
      #     p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT }}
      #     p12-password: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}

      - name: Build
        run: |
          make build DMG=1

      # - name: Codesign
      #   run: |
      #     xcrun notarytool submit _build/*.dmg --apple-id "${{ secrets.APPLE_ID_EMAIL }}" --password "${{ secrets.APPLE_ID_PASSWORD }}" --team-id "${{ secrets.APPLE_ID_TEAM }}" --wait
      #     xcrun stapler staple _build/*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CIS-macos
          path: |
            _build/*.dmg

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CIS-macos
          path: dist

      - name: Create the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.VERSION }}
          prerelease: false
          draft: true
          files: |
            dist/*
